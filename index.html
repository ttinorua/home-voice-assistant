<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14213d" />
  <title>Home Voice</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <style>
    :root { color-scheme: light dark; --bg: #f6f7fb; --fg: #14213d; --accent: #2a6df4; --muted: #5b6477; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1424; --fg: #eef1f8; --muted: #9aa3b8; } }
    body { margin: 0; font: 17px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    #app { max-width: 36rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: flex; flex-direction: column; gap: 0.75rem; }
    h1 { margin: 0; font-size: 1.4rem; }
    #status { margin: 0; font-weight: 600; }
    #message { margin: 0; }
    #hint { margin: 0; color: var(--muted); font-size: 0.9rem; }
    #passcode { font: inherit; padding: 0.7rem; border-radius: 0.6rem; border: 1px solid var(--muted); background: transparent; color: inherit; }
    #toggle { font: inherit; font-weight: 700; padding: 1rem; border-radius: 999px; border: 0; background: var(--accent); color: #fff; min-height: 3.5rem; }
    [data-state="listening"] #toggle { background: #1f9d55; }
    [data-state="speaking"] #toggle { background: #d9822b; }
    #transcript { list-style: none; margin: 0.5rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    #transcript li { padding: 0.6rem 0.8rem; border-radius: 0.6rem; background: rgba(127, 127, 127, 0.15); }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
